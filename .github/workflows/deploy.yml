name: Deploy to GoDaddy via FTP

on:
  push:
    branches:
      - main

permissions:
  contents: read

# Never interrupt a partial FTP upload, and never upload two releases together.
concurrency:
  group: production-ftp
  cancel-in-progress: false

jobs:
  ftp-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Validate public sources
        run: |
          node scripts/sync-styles.mjs --check
          python3 scripts/validate-site.py
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Stage and validate public files
        run: |
          public_site="$RUNNER_TEMP/public-site"
          python3 scripts/stage-public.py "$public_site"
          python3 scripts/validate-site.py --root "$public_site"
          python3 scripts/validate-recovery.py --root "$public_site"

      - name: Sync files to GoDaddy
        uses: SamKirkland/FTP-Deploy-Action@8e83cea8672e3fbcbb9fdafff34debf6ae4c5f65 # v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT }}
          protocol: ftp
          local-dir: ${{ runner.temp }}/public-site/
          server-dir: ${{ secrets.FTP_REMOTE_PATH }}
          log-level: verbose
          timeout: 60000
