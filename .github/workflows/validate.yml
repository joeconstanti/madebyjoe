name: Validate static site
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read

# Only a newer run for the same PR can replace obsolete validation.
concurrency:
  group: static-validation-${{ github.event.pull_request.number && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.event.pull_request.number != null }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Validate sources and failure paths
        run: |
          node scripts/sync-styles.mjs --check
          python3 scripts/validate-site.py
          python3 scripts/test-validation.py
          python3 scripts/test-generation.py
          python3 scripts/test-server.py
          python3 scripts/test-progressive-enhancement.py
          python3 scripts/test-recovery.py
          for file in js/*.js scripts/*.mjs; do node --check "$file"; done
      - name: Verify Apache behavior using the public artifact
        run: |
          sudo python3 scripts/stage-public.py /var/www/madebyjoe-public
          python3 scripts/validate-site.py --root /var/www/madebyjoe-public
          python3 scripts/validate-recovery.py --root /var/www/madebyjoe-public
          sudo a2enmod rewrite headers expires
          sudo tee /etc/apache2/sites-available/000-default.conf >/dev/null <<'APACHE'
          <VirtualHost *:80>
            DocumentRoot /var/www/madebyjoe-public
            <Directory /var/www/madebyjoe-public>
              AllowOverride All
              Require all granted
            </Directory>
          </VirtualHost>
          APACHE
          sudo apache2ctl configtest
          sudo systemctl restart apache2
          python3 scripts/check-server.py http://127.0.0.1
