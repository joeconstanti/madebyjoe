/* ───────────────────────── 1. CALIBRE ─────────────────────────
   Units: millimetres. +z = dial side, -z = bridge side, +x = 3 o'clock.
   Hunter layout (crown at 3, seconds at 6), like a 6498: 18,000 vph, 17 jewels.
   barrel 78 → centre pinion 12 (6.5 h per barrel turn × 7 turns ≈ 46 h)
   centre 80 → 10 third 75 → 10 fourth 80 → 8 escape (15 teeth)

 goldB:M({color:'#dba94f',roughness:.42,roughnessMap:tex(streak,.22,.22),bumpMap:tex(streak,.22,.22),bumpScale:.3}),
 balance:M({color:'#e8bd70',roughness:.14}),
 rose:M({color:'#e6b08c',roughness:.16}),
 blue:M({color:'#0d2490',roughness:.2,specularIntensity:.4}),
 hair:M({color:'#2f5bd6',roughness:.22}),

/* ───────────────────────── 4. GEOMETRY KIT ───────────────────── */
// Revolve a closed [r,z] polygon; hard edges stay hard, shallow ones smooth.
function rev(pr,seg=64){let a=0;const n=pr.length;for(let i=0;i<n;i++){const p=pr[i],q=pr[(i+1)%n];a+=p[0]*q[1]-q[0]*p[1]}if(a<0)pr=pr.slice().reverse();

function arbor(r,z0,z1,pv=.08){// z0<z1 ; pivots at both ends with conical shoulders
 const l=.5;return rev([[0,z0],[pv*.7,z0],[pv,z0+pv*.4],[pv,z0+l-.1],[r*.75,z0+l+.05],[r,z0+l+.12],[r,z1-l-.12],[r*.75,z1-l-.05],[pv,z1-l+.1],[pv,z1-pv*.4],[pv*.7,z1],[0,z1]],36)}
function spiral(r0,r1,turns,z0,z1,th,n){const pos=new Float32Array((n+1)*4*3),ix=[];for(let i=0;i<n;i++)for(let k=0;k<4;k++){const a=i*4+k,b=i*4+(k+1)%4;ix.push(a,a+4,b,b,a+4,b+4)}

 g.userData.set=(th0,br=0)=>{for(let i=0;i<=n;i++){const s=i/n,a=s*turns*TAU+th0*(1-s),r=r0+(r1-r0)*s+br*Math.sin(s*Math.PI)*(s),c=Math.cos(a),q=Math.sin(a);let o=i*12;for(const[rr,zz]of[[r-th/2,z0],[r+th/2,z0],[r+th/2,z1],[r-th/2,z1]]){pos[o++]=rr*c;pos[o++]=rr*q;pos[o++]=zz}}g.attributes.position.needsUpdate=true};
