<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Lantern Isle</title>
<link rel="icon" href="data:,">
<style>
*{box-sizing:border-box;margin:0}
html,body{height:100%;overflow:hidden;background:#0c1420;overscroll-behavior:none}
body{display:grid;place-items:center;font-family:ui-rounded,"SF Pro Rounded","Nunito","Trebuchet MS",system-ui,sans-serif;transition:background 3s}
body.storm{background:#04070c}
#stage{position:relative;width:min(100vw,56.25vh);width:min(100vw,56.25dvh);height:100vh;height:100dvh;overflow:hidden;background:#8ec9ee}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;outline:none}
canvas.drag{cursor:grabbing}
#ui{position:absolute;left:0;right:0;bottom:calc(24px + env(safe-area-inset-bottom));display:flex;justify-content:center;gap:14px;pointer-events:none}
button{pointer-events:auto;position:relative;overflow:hidden;min-width:132px;height:54px;padding:0 22px;border-radius:27px;border:1.5px solid rgba(255,255,255,.55);
 background:rgba(18,42,72,.5);-webkit-backdrop-filter:blur(14px) saturate(1.5);backdrop-filter:blur(14px) saturate(1.5);color:#fff;font:inherit;font-weight:800;font-size:16px;letter-spacing:.16em;text-indent:.16em;
 display:flex;align-items:center;justify-content:center;gap:9px;cursor:pointer;box-shadow:0 6px 22px rgba(8,24,48,.35),inset 0 1px 0 rgba(255,255,255,.3);transition:transform .15s,background .5s,border-color .5s;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;touch-action:manipulation}
button:hover{background:rgba(26,60,100,.62)}

button svg{width:20px;height:20px;flex:none}

#storm[aria-pressed=true]{background:rgba(255,176,72,.28);border-color:#ffd08a;color:#ffe9c4}
#msg{position:absolute;inset:0;display:none;place-items:center;padding:40px;text-align:center;color:#12304e;font-size:18px}
</style>
</head>
<body>
<main id="stage">
 <canvas id="c" aria-label="A voxel island in the sky. Drag to turn, scroll or pinch to zoom." role="img"></canvas>
 <div id="msg">This scene needs WebGL 2.</div>
 <div id="ui">
  <button id="storm" type="button" aria-pressed="false"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13.5 1 4 14h6.2L9 23l10-13.4h-6.4z"/></svg>STORM<i></i></button>
  <button id="whale" type="button"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M2 13c0-4 3.5-6.500 8-6.500 5 0 6.500 4 9 4 1 0 1.500-.8 1.500-2-1.600-.2-2.700-1.200-3-3 1.800-.2 3 .3 3.800 1.300.7-1 1.600-1.600 2.700-1.500 0 1.700-.7 2.900-2 3.400C22.500 15 18 20 11 20c-5.500 0-9-3-9-7zm5-.2a1.200 1.200 0 1 0 0-2.400 1.200 1.200 0 0 0 0 2.400z"/></svg>WHALE<i></i></button>
 </div>
</main>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id),cv=$('c'),stage=$('stage');
const gl=cv.getContext('webgl2',{antialias:false,alpha:false,powerPreference:'high-performance'});
if(!gl){$('msg').style.display='grid';cv.style.display='none';return}
const hdr=!!gl.getExtension('EXT_color_buffer_float');
cv.addEventListener('webglcontextlost',e=>{e.preventDefault();setTimeout(()=>location.reload(),400)});

/* ───────────── maths ───────────── */
const {sin,cos,abs,min,max,floor,hypot,PI,sqrt,round,atan2,pow,exp}=Math;
const clamp=(x,a=0,b=1)=>x<a?a:x>b?b:x,lerp=(a,b,t)=>a+(b-a)*t,smooth=(a,b,x)=>{x=clamp((x-a)/(b-a));return x*x*(3-2*x)};
let seed=7;const rnd=()=>{seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296};
const rr=(a,b)=>a+rnd()*(b-a),pick=a=>a[floor(rnd()*a.length)];
const h2=(x,y)=>{let n=Math.imul(x|0,374761393)+Math.imul(y|0,668265263)|0;n=Math.imul(n^n>>>13,1274126177);return((n^n>>>16)>>>0)/4294967296};
const h3=(x,y,z)=>h2(x+Math.imul(z,57),y+Math.imul(z,131));
const vn=(x,y)=>{const i=floor(x),j=floor(y);let u=x-i,v=y-j;u=u*u*(3-2*u);v=v*v*(3-2*v);return lerp(lerp(h2(i,j),h2(i+1,j),u),lerp(h2(i,j+1),h2(i+1,j+1),u),v)};
const fbm=(x,y)=>vn(x,y)*.55+vn(x*2.1+9,y*2.1+4)*.3+vn(x*4.3+3,y*4.3+7)*.15;
const norm=v=>{const l=hypot(...v)||1;return v.map(a=>a/l)},cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]],dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const mul=(a,b)=>{const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s}return o};
const persp=(f,a,n,fa,oy)=>{const t=1/Math.tan(f/2),o=new Float32Array(16);o[0]=t/a;o[5]=t;o[9]=oy;o[10]=(fa+n)/(n-fa);o[11]=-1;o[14]=2*fa*n/(n-fa);return o};
const ortho=(w,h,n,f)=>new Float32Array([1/w,0,0,0,0,1/h,0,0,0,0,-2/(f-n),0,0,0,-(f+n)/(f-n),1]);
const look=(e,t)=>{const z=norm([e[0]-t[0],e[1]-t[1],e[2]-t[2]]),x=norm(cross([0,1,0],z)),y=cross(z,x);return new Float32Array([x[0],y[0],z[0],0,x[1],y[1],z[1],0,x[2],y[2],z[2],0,-dot(x,e),-dot(y,e),-dot(z,e),1])};
const lin=h=>[16,8,0].map(s=>pow((h>>s&255)/255,2.2));
const segD=(px,pz,a,b)=>{const dx=b[0]-a[0],dz=b[1]-a[1],t=clamp(((px-a[0])*dx+(pz-a[1])*dz)/(dx*dx+dz*dz));return[hypot(px-a[0]-dx*t,pz-a[1]-dz*t),t]};
const polyD=(x,z,p)=>{let b=1e9;for(let i=0;i+1<p.length;i++)b=min(b,segD(x,z,p[i],p[i+1])[0]);return b};

/* ───────────── voxel palette and mesher ───────────── */
const pal=[null],palKey=new Map();
const P=(hex,mat=0,vary=.07)=>{const k=hex+'|'+mat+'|'+vary;let i=palKey.get(k);if(!i){i=pal.length;pal.push({c:lin(hex),mat,vary});palKey.set(k,i)}return i};
const ST=13;
class Buf{constructor(){this.v=new Float32Array(1<<18);this.n=0;this.ix=[]}
 room(k){if(this.n+k>this.v.length){const o=new Float32Array(this.v.length*2);o.set(this.v);this.v=o}}
 vert(x,y,z,n,r,g,b,ao,u,v,m,o){this.room(ST);const a=this.v;let i=this.n;a[i]=x;a[i+1]=y;a[i+2]=z;a[i+3]=n;a[i+4]=r;a[i+5]=g;a[i+6]=b;a[i+7]=ao;a[i+8]=u;a[i+9]=v;a[i+10]=m;a[i+11]=o;a[i+12]=0;this.n+=ST}
 quad(fl){const b=this.n/ST-4;if(fl)this.ix.push(b+1,b+2,b+3,b+1,b+3,b);else this.ix.push(b,b+1,b+2,b,b+2,b+3)}}
// face: normal axis, sign, u axis, v axis (u × v = n)
const FACES=[[0,1,1,2],[0,-1,2,1],[1,1,2,0],[1,-1,0,2],[2,1,0,1],[2,-1,1,0]];
const AOV=[.42,.64,.83,1],CU=[0,1,1,0],CV=[0,0,1,1];
function meshVoxel(B,x,y,z,id,ord,solid,scale,ox,oy,oz,full){
 const p=pal[id],c=p.c,hh=1+(h3(x,y,z)-.5)*2*p.vary,cell=[x,y,z];
 for(let f=0;f<6;f++){const[na,ns,ua,va]=FACES[f],q=[x,y,z];q[na]+=ns;if(full(q[0],q[1],q[2]))continue;
  const ao=[0,0,0,0];
  for(let k=0;k<4;k++){const du=CU[k]*2-1,dv=CV[k]*2-1,a=q.slice(),b=q.slice(),e=q.slice();a[ua]+=du;b[va]+=dv;e[ua]+=du;e[va]+=dv;
   const s1=solid(a[0],a[1],a[2],ua,du),s2=solid(b[0],b[1],b[2],va,dv),s3=solid(e[0],e[1],e[2]);ao[k]=AOV[s1&&s2?0:3-s1-s2-s3];}
  for(let k=0;k<4;k++){const t=cell.slice();if(ns>0)t[na]++;t[ua]+=CU[k];t[va]+=CV[k];
   B.vert(t[0]*scale+ox,t[1]*scale+oy,t[2]*scale+oz,f,c[0]*hh,c[1]*hh,c[2]*hh,ao[k],CU[k],CV[k],p.mat,ord)}
  B.quad(ao[0]+ao[2]<ao[1]+ao[3]);
 }}
function box(B,x,y,z,sx,sy,sz,hex,mat=0,ord=0){const c=Array.isArray(hex)?hex:lin(hex),s=[sx/2,sy/2,sz/2],o=[x,y,z],hh=1+(h3(x*9|0,y*9|0,z*9|0)-.5)*.16;
 for(let f=0;f<6;f++){const[na,ns,ua,va]=FACES[f];for(let k=0;k<4;k++){const t=o.slice();t[na]+=ns*s[na];t[ua]+=(CU[k]*2-1)*s[ua];t[va]+=(CV[k]*2-1)*s[va];B.vert(t[0],t[1],t[2],f,c[0]*hh,c[1]*hh,c[2]*hh,f==3?.7:1,CU[k],CV[k],mat,ord)}B.quad(false)}}
class Vox{constructor(s){this.s=s;this.m=new Map()}
 key(x,y,z){return(x+256)*1048576+(y+256)*1024+z+256}
 put(x,y,z,id,o=0){this.m.set(this.key(x,y,z),[x,y,z,id,o])}
 del(x,y,z){this.m.delete(this.key(x,y,z))}
 has(x,y,z){return this.m.has(this.key(x,y,z))}
 mesh(B,ox=0,oy=0,oz=0){const s=(x,y,z)=>this.has(x,y,z)?1:0;for(const[x,y,z,id,o]of this.m.values())meshVoxel(B,x,y,z,id,o,s,this.s,ox,oy,oz,s);return B}}

/* ───────────── world grids: T = 1-unit terrain, D = half-unit detail ───────────── */
const OF=56,OY=56,NX=112,NYY=112,T=new Uint16Array(NX*NYY*NX),DX=224,DY=224,D=new Uint16Array(DX*DY*DX),Dlist=[],ordM=new Map();
const ti=(x,y,z)=>(x+OF)+NX*((z+OF)+NX*(y+OY)),inT=(x,y,z)=>x>=-OF&&x<OF&&z>=-OF&&z<OF&&y>=-OY&&y<OY;
const tget=(x,y,z)=>inT(x,y,z)?T[ti(x,y,z)]:0,tput=(x,y,z,id)=>{if(inT(x,y,z))T[ti(x,y,z)]=id};
// D coordinates: world * 2, centred on the same origin
const di=(x,y,z)=>(x+112)+DX*((z+112)+DX*(y+112)),inD=(x,y,z)=>x>=-112&&x<112&&z>=-112&&z<112&&y>=-112&&y<112;
const dget=(x,y,z)=>inD(x,y,z)?D[di(x,y,z)]:0;
const put=(x,y,z,id,o=0,keep=false)=>{x=floor(x);y=floor(y);z=floor(z);if(!inD(x,y,z))return;const i=di(x,y,z);if(D[i]){if(keep)return}else Dlist.push(i);D[i]=id;if(o)ordM.set(i,o);else ordM.delete(i)};
const solidD=(x,y,z)=>(dget(x,y,z)||tget(x>>1,y>>1,z>>1))?1:0;
const fillD=(x0,y0,z0,x1,y1,z1,id,o)=>{for(let y=y0;y<=y1;y++)for(let z=z0;z<=z1;z++)for(let x=x0;x<=x1;x++)put(x,y,z,typeof id=='function'?id(x,y,z):id,o)};

const G=new Buf();let ordN=1;const lamps=[];            // lamps: x,y,z,order,power,radius
const lamp=(x,y,z,o,p=1,r=8)=>lamps.push([x,y,z,o,p,r]);
const smokes=[];

/* layout */
const LH=[-20,-22];
const STREAM=[[-13,-19],[-9,-12],[-2,-7],[6,-4]],RIVER=[[6,-4],[17,2],[30,11],[56,23]];
const PATHS=[[[-36,11],[-24,12],[-12,20],[-4,25],[-4,46]],[[-4,25],[6,16],[15,19],[24,20],[26,14],[26,6],[24,-3],[25,-18]],[[-24,12],[-27,3],[-28,-3]]];
const HOUSES=[
 {x:-35,z:4,w:9,d:7,h:5,rot:0,wall:0xf3e3c3,roof:0x2f6f8f,door:0xc8503c},
 {x:-24,z:20,w:8,d:7,h:6,rot:2,wall:0xe9b7a0,roof:0x7c3f58,door:0x2c6e6a},
 {x:-10,z:11,w:9,d:7,h:6,rot:0,wall:0xf7f0e2,roof:0xc4513a,door:0x2f5f9a},
 {x:6,z:26,w:9,d:8,h:6,rot:3,wall:0xa9d3cc,roof:0x3f5878,door:0xd9983a},
 {x:20,z:28,w:8,d:7,h:5,rot:2,wall:0xf2d27e,roof:0x4d7a52,door:0x8a3b52}];
const TREES=[[-38,-6,1],[-6,0,1.1],[14,-12,1.15],[20,-25,1.25],[32,-18,1.05],[27,-32,.95],[34,-5,1],[-16,29,1],[13,11,.8],[34,24,.95],[-30,29,.85],[4,-20,1.1],[8,-35,1],[-14,3,.8]];
const PINES=[[-31,-29,1.1],[-10,-33,1],[-35,-17,.9],[-2,-27,.8],[40,2,.8],[-41,13,.8],[-6,-41,.8],[18,-38,.7]];
const rimR=th=>43+3.2*sin(3*th+1)+2*sin(5*th+2.4)+1.2*sin(9*th);
const gy=(x,z)=>{for(let y=45;y>-8;y--)if(tget(floor(x),y,floor(z)))return y+1;return 1};

const FALL={};
(function terrain(){
 const grass=[0x7fbf4f,0x8cc957,0x74b549,0x97cf5c].map(h=>P(h,0,.06)),pink=[0xf6b7cf,0xeea3c0].map(h=>P(h)),dirt=P(0x8a5f43),dirt2=P(0x764d38),rock=[0x9a938e,0x8a8380,0xa8a097].map(h=>P(h)),rk2=[0x7d6f76,0x6c6070,0x8b7a7c].map(h=>P(h)),rk3=[0x5b5068,0x4c4560,0x6b5a70].map(h=>P(h)),moss=P(0x6f9a52),sand=[0xe8d3a1,0xdcc592].map(h=>P(h)),cob=[0xb9ada0,0xa79b90,0xcabfae].map(h=>P(h)),water=P(0x3fb4d8,2,.03),fall=P(0x8fdcf2,7,.03),bed=P(0x6d8a86);
 for(let x=-OF;x<OF;x++)for(let z=-OF;z<OF;z++){
  const cx=x+.5,cz=z+.5,r=hypot(cx,cz),th=atan2(cz,cx),R=rimR(th)+(h2(x,z)-.5)*1.6;if(r>R)continue;
  let h=1+(fbm(cx*.07+5,cz*.07)>.56?1:0)+(fbm(cx*.06+25,cz*.06)>.64?1:0);
  const nd=(fbm(cx*.14+31,cz*.14+8)-.5)*7,dc=hypot(cx-LH[0],cz-LH[1])+nd,dh=hypot(cx-26,cz+24)+nd;
  if(dh<17)h=max(h,3);if(dh<11)h=max(h,5);
  let cliff=0;if(dc<19){h=max(h,4);}if(dc<15.5){h=max(h,9);cliff=1}if(dc<12.5){h=13;cliff=1}
  if(hypot(cx-LH[0],cz-LH[1])<8)h=13;
  const dr=polyD(cx,cz,RIVER),ds=polyD(cx,cz,STREAM),dp=hypot(cx-6,cz+4)+(vn(x*.3,z*.3)-.5)*2;
  const isR=(dr<2.6&&cx>6)||dp<6.6,isS=ds<1.5;
  if((dr<6.5&&cx>4)||dp<10)h=min(h,1);
  for(const H of HOUSES)if(abs(cx-H.x)<H.w/2+2.5&&abs(cz-H.z)<H.d/2+2.5)h=1;
  let path=0;for(const p of PATHS)if(polyD(cx,cz,p)<1.7+(h2(x+9,z)-.5)*.5)path=1;
  if(cz>8&&path)h=min(h,1);
  if(r>R-1.5&&!cliff&&h2(x+3,z+5)>.5)h-=1;
  const f=r/R,dep=2.5+30*pow(1-f,.75)*(.62+.55*fbm(cx*.11+50,cz*.11))+vn(x*.45,z*.45)*5+(vn(x*.8+7,z*.8)>.78?5:0);
  const bot=-floor(dep);
  for(let y=bot;y<=h;y++){
   const n=fbm(cx*.1+y*.13,cz*.1-y*.09),k=-y+n*7;let id;
   if(y>h-1)id=cliff&&dc>11.7?pick(rock):pick(grass);
   else if(h>3&&y>1)id=vn(x*.5,y*.4+z*.5)>.82?moss:rock[floor(n*9)%3];
   else if(y>h-3)id=n>.5?dirt:dirt2;
   else if(k<9)id=rock[floor(n*11)%3];else if(k<21)id=rk2[floor(n*13)%3];else id=rk3[floor(n*13)%3];
   if(y<0&&vn(x*.35+y*.1,y*.35+z*.3)>.84&&f>.7)id=moss;
   tput(x,y,z,id)}
  if(!isR&&!isS&&path&&!cliff)tput(x,h,z,cz>38?pick(sand):pick(cob));
  else if(!isR&&!isS&&!cliff){for(const t of TREES)if(hypot(cx-t[0],cz-t[1])<6.5*t[2]&&rnd()<.22)tput(x,h,z,pick(pink))}
  if(isR){for(let y=h;y>0;y--)tput(x,y,z,0);tput(x,0,z,water);tput(x,-1,z,bed);if(r>R-2.2)for(let y=0;y>-5;y--)tput(x,y,z,fall)}
  else if(isS&&dp>6){if(h>2)for(let y=0;y<=h;y++)tput(x,y,z,y==h?water:fall);else{tput(x,h,z,0);tput(x,h-1,z,water)}}
  else if(((dr<4.2&&cx>4)||dp<8.2)&&!path&&h<=1&&rnd()<.55)tput(x,h,z,pick(sand));
 }
 // great waterfall off the rim
 let k=0;for(k=30;k<56;k+=.25){const p=[k,11+(k-30)*12/26];if(hypot(...p)>rimR(atan2(p[1],p[0]))+.2)break}
 const fx=k,fz=11+(k-30)*12/26,d=norm([26,12]);FALL.x=fx;FALL.z=fz;FALL.d=d;
 for(let y=0;y>-56;y--){const out=min(4.5,sqrt(-y)*.75),rad=2.9-min(.7,-y*.02)+(vn(y*.5,3)-.5)*.5;
  for(let x=floor(fx)-7;x<fx+8;x++)for(let z=floor(fz)-7;z<fz+8;z++){const ax=x+.5-fx-d[0]*out,az=z+.5-fz-d[1]*out,al=ax*d[0]+az*d[1],si=-ax*d[1]+az*d[0];
   if(abs(si)<rad&&abs(al)<1.1+(y>-3?1.4:0)&&!tget(x,y,z))tput(x,y,z,fall)}}
})();

/* ───────────── houses ───────────── */
const timber=P(0x6b4630),timberD=P(0x533424),stone=[0x9c9690,0x88837f,0xb0a9a0].map(h=>P(h)),PANE=P(0xbfe3f2,3,.02);
function house(H){
 const w=H.w*2,d=H.d*2,h=H.h*2-1,by=4,wallA=P(H.wall,0,.05),roofs=[P(H.roof,0,.14),P(H.roof,0,.22)],door=P(H.door),shut=P(H.door,0,.1),white=P(0xfbf6ea,0,.03),leaf=P(0x5d9c44),fl=[0xff6f91,0xffd35c,0xff9a5c].map(v=>P(v));
 const swap=H.rot&1,hw=w>>1,hd=d>>1;
 // local a across the front, b depth (front is b=d-1)
 const M=(a,b)=>{let x=a-hw,z=b-hd;if(H.rot==2){x=-1-x;z=-1-z}else if(H.rot==1){const t=x;x=z;z=-1-t}else if(H.rot==3){const t=x;x=-1-z;z=t}return[H.x*2+x,H.z*2+z]};
 const L=(a,y,b,id,o)=>{const[x,z]=M(a,b);put(x,by+y,z,typeof id=='function'?id():id,o)};
 const W=(a,y,b)=>{const[x,z]=M(a,b),[x2,z2]=M(a+1,b+1);return[(x+x2)/4,(by+y)/2,(z+z2)/4]};
 for(let a=-1;a<=w;a++)for(let b=-1;b<=d;b++)for(let y=-5;y<1;y++)L(a,y,b,pick(stone));
 for(let a=0;a<w;a++)for(let b=0;b<d;b++)for(let y=1;y<=h;y++){const ca=a==0||a==w-1,cb=b==0||b==d-1;L(a,y,b,(ca&&cb)||y==h?timber:y==1?pick(stone):wallA)}
 // gable roof, ridge along a
