import {EffectComposer} from 'three/addons/postprocessing/EffectComposer.js';

/* ───────── utilities ───────── */
const $=s=>document.querySelector(s);

const tick=()=>new Promise(r=>{const c=new MessageChannel();c.port1.onmessage=()=>setTimeout(r,16);c.port2.postMessage(0)});
const sleep=ms=>new Promise(r=>setTimeout(r,ms));

/* ───────── world constants ───────── */
const HALF=900,G=4,N=HALF*2/G+1,RAD=780;     // near terrain: ±900 m on a 4 m grid
const W={};                                     // everything about the current place

/* ───────── data sources ───────── */
async function geocode(q){
  const u='https://nominatim.openstreetmap.org/search?format=jsonv2&limit=1&addressdetails=1&accept-language=en&q='+encodeURIComponent(q);
  let r;try{r=await fetch(u)}catch(e){throw new Error('Could not reach the OpenStreetMap search. Check your connection and try again.')}
  if(!r.ok)throw new Error('The OpenStreetMap search is busy ('+r.status+'). Wait a few seconds and try again.');
  const j=await r.json();
  if(!j.length)throw new Error('No place found for “'+q+'”. Try adding a town or a country.');
  return {lat:+j[0].lat,lon:+j[0].lon,label:j[0].display_name,name:j[0].name,cc:(j[0].address&&j[0].address.country_code)||''};
}
const OVERPASS=['https://overpass-api.de/api/interpreter','https://maps.mail.ru/osm/tools/overpass/api/interpreter','https://overpass.kumi.systems/api/interpreter','https://overpass.private.coffee/api/interpreter'];
async function fetchOSM(lat,lon,note){

  const key='https://anyroad.cache/v1/'+bb;
  try{const c=await caches.open('anyroad');const m=await c.match(key);if(m)return await m.json()}catch(e){}

  const ac=new AbortController();let empty=null;

    const r=await fetch(url,{method:'POST',body:new URLSearchParams({data:q}),signal:ac.signal});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const j=await r.json();
    if(!j.elements||(/error|timed out/i.test(j.remark||'')))throw new Error('incomplete');
    if(!j.elements.some(e=>e.tags&&e.tags.highway)){empty=j;throw new Error('empty')}

  const run=()=>new Promise((ok,no)=>{
    let next=0,live=0,done=false,timer;
    const start=()=>{clearTimeout(timer);if(done||next>=OVERPASS.length)return;
      const i=next++;live++;if(i)note('Map server '+i+' is slow, also trying server '+(i+1));
      timer=setTimeout(start,9000);
      one(OVERPASS[i]).then(j=>{if(!done){done=true;clearTimeout(timer);ok(j);}},()=>{live--;if(done)return;if(next<OVERPASS.length)start();else if(!live){done=true;no()}})};
    start();setTimeout(()=>{if(!done){done=true;no()}},75000)});

}
async function loadElev(lat,lon,z,radius){
  const n=2**z,px=l=>(l+180)/360*n*256,py=l=>{const s=Math.sin(l*Math.PI/180);return(.5-Math.log((1+s)/(1-s))/(4*Math.PI))*n*256};

  const x0=Math.floor((cx-rp)/256),x1=Math.floor((cx+rp)/256),y0=Math.floor((cy-rp)/256),y1=Math.floor((cy+rp)/256);
  const w=(x1-x0+1)*256,h=(y1-y0+1)*256,D=new Float32Array(w*h);let got=0;const jobs=[];
  for(let ty=y0;ty<=y1;ty++)for(let tx=x0;tx<=x1;tx++)jobs.push((async()=>{
    for(let k=0;k<2;k++)try{
      const r=await fetch(`https://s3.amazonaws.com/elevation-tiles-prod/terrarium/${z}/${((tx%n)+n)%n}/${ty}.png`);if(!r.ok)continue;
      const bm=await createImageBitmap(await r.blob(),{colorSpaceConversion:'none',premultiplyAlpha:'none'});
      const [,g]=mkCanvas(256,256,true);g.drawImage(bm,0,0);const d=g.getImageData(0,0,256,256).data;
      for(let j=0;j<256;j++)for(let i=0;i<256;i++){const o=(j*256+i)*4;let e=d[o]*256+d[o+1]+d[o+2]/256-32768;if(e<-9000||e>9000)e=0;D[((ty-y0)*256+j)*w+(tx-x0)*256+i]=e}
      got++;return}catch(e){}

  return {ok:got>0,at(x,zz){
    const u=clamp(px(lon+x*kx)-x0*256-.5,0,w-1.01),v=clamp(py(lat-zz*kz)-y0*256-.5,0,h-1.01);
    const i=u|0,j=v|0,a=u-i,b=v-j,o=j*w+i;
    return (D[o]*(1-a)+D[o+1]*a)*(1-b)+(D[o+w]*(1-a)+D[o+w+1]*a)*b}};
}

/* ───────── heightfield ───────── */
function bspl(A,x,z){ // uniform cubic B-spline, so the car, roads and terrain share one smooth surface
  const u=clamp((x+HALF)/G,1,N-2.001),v=clamp((z+HALF)/G,1,N-2.001),i=u|0,j=v|0,a=u-i,b=v-j;
  const a0=(1-a)**3/6,a1=(3*a*a*a-6*a*a+4)/6,a2=(-3*a*a*a+3*a*a+3*a+1)/6,a3=a*a*a/6;

  let o=(j-1)*N+i-1;const r=()=>{const q=A[o]*a0+A[o+1]*a1+A[o+2]*a2+A[o+3]*a3;o+=N;return q};
  return r()*b0+r()*b1+r()*b2+r()*b3;
}
const S=(x,z)=>bspl(W.H,x,z);
function T(x,z){ // exact height of the drawn terrain triangles
  const u=clamp((x+HALF)/G,0,N-1.001),v=clamp((z+HALF)/G,0,N-1.001),i=u|0,j=v|0,a=u-i,b=v-j,o=j*N+i,A=W.TH;
  return a+b<1?A[o]+(A[o+1]-A[o])*a+(A[o+N]-A[o])*b:A[o+N+1]+(A[o+N]-A[o+N+1])*(1-a)+(A[o+1]-A[o+N+1])*(1-b);
}
function blur(A,n){const B=new Float32Array(A.length);for(let k=0;k<n;k++){
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const o=j*N+i;B[o]=(A[i?o-1:o]+2*A[o]+A[i<N-1?o+1:o])/4}
  for(let j=0;j<N;j++)for(let i=0;i<N;i++){const o=j*N+i;A[o]=(B[j?o-N:o]+2*B[o]+B[j<N-1?o+N:o])/4}}}

/* ───────── spatial hash ───────── */
class Hash{constructor(c){this.c=c;this.m=new Map()}
  add(o,x0,z0,x1,z1){const c=this.c;for(let i=Math.floor(x0/c);i<=Math.floor(x1/c);i++)for(let j=Math.floor(z0/c);j<=Math.floor(z1/c);j++){const k=i*73856+j;let a=this.m.get(k);if(!a)this.m.set(k,a=[]);a.push(o)}}
  at(x,z){return this.m.get(Math.floor(x/this.c)*73856+Math.floor(z/this.c))||EMPTY}}
const EMPTY=[];
function segDist(s,x,z){const dx=s.bx-s.ax,dz=s.bz-s.az,l=dx*dx+dz*dz;const t=l?clamp(((x-s.ax)*dx+(z-s.az)*dz)/l,0,1):0;s._t=t;return Math.hypot(x-s.ax-dx*t,z-s.az-dz*t)}

/* ───────── polygons ───────── */
const area=p=>{let a=0;for(let i=0,n=p.length;i<n;i++){const q=p[(i+1)%n];a+=p[i][0]*q[1]-q[0]*p[i][1]}return a/2};
function inPoly(p,x,z){let c=false;for(let i=0,j=p.length-1;i<p.length;j=i++){const a=p[i],b=p[j];if((a[1]>z)!==(b[1]>z)&&x<(b[0]-a[0])*(z-a[1])/(b[1]-a[1])+a[0])c=!c}return c}
function clean(p){ // drop duplicates and collinear points, force a positive area
  p=p.slice();if(p.length>1&&Math.hypot(p[0][0]-p.at(-1)[0],p[0][1]-p.at(-1)[1])<.05)p.pop();
  for(let k=0;k<2;k++)for(let i=p.length-1;i>=0&&p.length>3;i--){const a=p[(i+p.length-1)%p.length],b=p[i],c=p[(i+1)%p.length];
    const L=Math.hypot(c[0]-a[0],c[1]-a[1]);const d=Math.abs((b[0]-a[0])*(c[1]-a[1])-(b[1]-a[1])*(c[0]-a[0]))/(L||1);
    if(Math.hypot(b[0]-a[0],b[1]-a[1])<.12||(d<.12&&L>.1))p.splice(i,1)}

  while(segs.length){let r=segs.pop(),go=true;while(go&&!eq(r[0],r.at(-1))){go=false;for(let i=0;i<segs.length;i++){const s=segs[i];
    if(eq(r.at(-1),s[0]))r=r.concat(s.slice(1));else if(eq(r.at(-1),s.at(-1)))r=r.concat(s.slice().reverse().slice(1));else if(eq(r[0],s.at(-1)))r=s.concat(r.slice(1));else if(eq(r[0],s[0]))r=s.slice().reverse().concat(r.slice(1));else continue;

    if(r.length>3)out.push(r)}return out}

/* ───────── OSM → features ───────── */
const LEFT=new Set('gb ie au nz jp in za th my sg hk id ke ug tz zm zw lk pk bd np mt cy jm bb bs tt mu fj'.split(' '));
const EU=new Set('fr de it es pt nl be lu ch at pl cz sk hu si hr ba rs me mk al gr bg ro se no dk fi ee lv lt ua by md tr'.split(' '));
